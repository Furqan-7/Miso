<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobPilot</title>
    <style>
      :root { --bg: #fff; --ink: #17181a; --ink2: #4b4d52; --ink3: #7c7f86; --line: #e4e4df; --soft: #f1f1ee; --brand: #0f766e; --brandInk: #fff; --ok: #15803d; --bad: #b91c1c; color-scheme: light; }
      @media (prefers-color-scheme: dark) { :root { --bg: #17181b; --ink: #ececea; --ink2: #b6b8bc; --ink3: #85888e; --line: #2b2d31; --soft: #1f2024; --brand: #2dd4bf; --brandInk: #062a26; --ok: #4ade80; --bad: #f87171; color-scheme: dark; } }
      * { box-sizing: border-box; }
      body { margin: 0; width: 380px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
      header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
      .logo { width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color: var(--brandInk); display: grid; place-items: center; font-weight: 700; }
      main { padding: 14px; display: grid; gap: 10px; }
      label { display: grid; gap: 4px; font-weight: 500; color: var(--ink2); }
      input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; background: var(--bg); color: var(--ink); }
      textarea { min-height: 160px; resize: vertical; }
      button { height: 34px; border: 0; border-radius: 8px; background: var(--brand); color: var(--brandInk); font: inherit; font-weight: 600; cursor: pointer; padding: 0 12px; }
      button.secondary { background: var(--soft); color: var(--ink); }
      button:disabled { opacity: .5; cursor: default; }
      .muted { color: var(--ink3); }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
      .badge { display: inline-block; border-radius: 999px; padding: 1px 8px; background: var(--soft); font-size: 11px; }
      .ok { color: var(--ok); } .bad { color: var(--bad); }
      .hidden { display: none; }
      a { color: var(--brand); }
    </style>
  </head>
  <body>
    <header><span class="logo">J</span><strong>JobPilot</strong><span id="who" class="muted" style="margin-left:auto"></span></header>
    <main>
      <section id="login" class="hidden">
        <p class="muted">Sign in to your JobPilot account.</p>
        <label>App URL <input id="base" value="http://localhost:3000" /></label>
        <label>Email <input id="email" type="email" /></label>
        <label>Password <input id="password" type="password" /></label>
        <button id="signin">Sign in</button>
        <p id="loginError" class="bad"></p>
      </section>

      <section id="capture" class="hidden">
        <p class="muted" id="pageInfo">Reading this page…</p>
        <div class="row">
          <button id="go">Find email &amp; draft</button>
          <button id="logout" class="secondary">Sign out</button>
        </div>
        <p id="status" class="muted"></p>
        <div id="result" class="hidden" style="display:grid;gap:10px">
          <div class="card" id="companyCard"></div>
          <div class="card" id="contactCard"></div>
          <label>Subject <input id="subject" /></label>
          <label>Email <textarea id="body"></textarea></label>
          <div class="row">
            <button id="copy" class="secondary">Copy</button>
            <a id="open" target="_blank" rel="noreferrer">Open in JobPilot →</a>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
